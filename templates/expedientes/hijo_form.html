{% extends "base.html" %}
{% block titulo %}{{ view.titulo }}{% endblock %}
{% block contenido %}

    <div>
        <h2>{{ view.titulo }}</h2>
        <p>Expediente: {{ expediente.caratula }}</p>
    </div>

    <form method="post" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>

    <div>
        <a href="{% url 'expedientes:detalle' expediente.pk %}">Cancelar y volver al expediente</a>
    </div>

{% endblock %}
