{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
    <article>
        <header><h2>Crear cuenta</h2></header>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Crear cuenta</button>
        </form>
        <footer>¿Ya tenés cuenta? <a href="{% url 'login' %}">Ingresar</a></footer>
    </article>
{% endblock %}
